[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dischem-enrich"
version = "0.1.0"
description = "Evidence-grounded product data enrichment pipeline for the Zindi Dis-Chem challenge"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
